<style>
*, *::before, *::after { box-sizing: border-box; }

body {
  font-family: 'Inter', sans-serif;
  background-color: #f8f5f2;
  margin: 0;
  padding: 20px;
}

h1 {
  font-family: 'Inter', sans-serif;
  color: rgb(209, 92, 8);
  font-weight: 800;
  text-align: center;
  font-size: 2rem;
  margin-bottom: 20px;
}

div.gal, .tut, .soap, .first {
  margin: 8px;
  border: 1px solid rgba(255, 255, 255, 0.8);
  float: left;
  transition: border-color 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease, background 0.25s ease;
  border-radius: 12px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.65);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06), inset 0 1px 1px rgba(255, 255, 255, 0.9);
}
div.gal { width: 100px; }
.tut { width: 175px; }
.soap { width: 140px; }
.first { width: 115px; }

div.gal:hover, .tut:hover, .soap:hover, .first:hover,
div#modi:hover {
  border-color: rgb(209, 92, 8);
  transform: translateY(-3px);
  box-shadow: 0 6px 16px rgba(209, 92, 8, 0.2);
}
div.gal:active, .tut:active, .soap:active, .first:active {
  transform: translateY(0);
  box-shadow: none;
}

div.gallery img {
  width: 100%;
  height: auto;
}

div.des {
  padding: 5px;
  text-align: center;
  font-family: 'Inter', sans-serif;
  font-size: 0.72rem;
  font-weight: 500;
  color: #555;
}

div.center {
  margin: auto;
}
</style>
<body>

        </div>

        <div class="tut" id="modi">
